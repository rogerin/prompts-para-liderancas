<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#092c38">
  <meta name="description" content="Workshop KeyCore Academy: prompts, dados e decisões C-Level. Slides ao vivo, exercícios e biblioteca de estudo.">
  <title>Prompts para Lideranças | KeyCore Academy</title>
  <link rel="stylesheet" href="static/styles.css">
  <script src="static/content.js" defer></script>
  <script src="static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#stage">Ir para o slide</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="KeyCore Academy, início"><img id="brand-logo" src="keycore-logo.png" alt="KeyCore" hidden><span id="brand-fallback">keycore<span class="brand-dot">.</span></span><span class="academy">ACADEMY</span></a>
    <span class="header-title">PROMPTS PARA LIDERANÇAS</span>
    <nav class="top-actions" aria-label="Ferramentas do workshop">
      <button class="quiet" data-action="library">Biblioteca <span class="count-badge">33</span></button>
      <button class="quiet" data-action="gallery">Comparar</button>
      <button class="primary small" data-action="room">Sala</button>
    </nav>
  </header>
  <div class="session-bar"><span id="connection" role="status">Modo de estudo</span><span id="room-label"></span><button id="follow" class="text-button" data-action="follow" hidden>Seguir apresentador</button></div>
  <main id="stage" tabindex="-1" aria-label="Apresentação"></main>
  <footer class="bottom-bar">
    <div class="bottom-left"><span id="chapter"></span><button class="text-button" data-action="map">Ver roteiro</button></div>
    <div class="progress-track" aria-hidden="true"><div id="progress"></div></div>
    <nav class="slide-nav" aria-label="Navegação dos slides">
      <button class="circle" data-action="prev" aria-label="Slide anterior">←</button>
      <span id="counter" aria-live="polite"></span>
      <button class="circle next" data-action="next" aria-label="Próximo slide">→</button>
      <button class="circle fullscreen" data-action="fullscreen" aria-label="Alternar tela cheia">⛶</button>
    </nav>
  </footer>
  <dialog id="panel" aria-labelledby="panel-title"><header class="panel-header"><div><span class="eyebrow" id="panel-kicker">KEYCORE ACADEMY</span><h2 id="panel-title"></h2></div><button class="circle" data-action="close" aria-label="Fechar painel">×</button></header><div id="panel-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Ative JavaScript para navegar no workshop. Os materiais estão na pasta resources do projeto.</noscript>
</body>
</html>
