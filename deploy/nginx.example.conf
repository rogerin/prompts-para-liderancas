# Exemplo parcial. Substituir o domínio e configurar TLS antes de uso público.
# Não cria nem altera a infraestrutura existente automaticamente.
server {
    listen 443 ssl;
    server_name workshop.SEUDOMINIO;
    # ssl_certificate /caminho/fullchain.pem;
    # ssl_certificate_key /caminho/privkey.pem;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
