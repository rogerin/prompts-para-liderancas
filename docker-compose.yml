services:
  prompts-para-liderancas:
    build: .
    container_name: keycore-prompts-liderancas
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8101", "--workers", "1"]
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - prompts-liderancas-data:/app/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  prompts-liderancas-data:
